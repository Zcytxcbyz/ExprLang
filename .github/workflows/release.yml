name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --all-features

  create-release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: exprlang
            asset_name: exprlang-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: exprlang.exe
            asset_name: exprlang-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: exprlang
            asset_name: exprlang-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Locate and rename binary
        shell: bash
        run: |
          BIN_PATH=$(find target/${{ matrix.target }}/release -maxdepth 1 -type f -executable -print -quit 2>/dev/null || echo "")
          if [ -z "$BIN_PATH" ]; then
            echo "❌ No executable found!"
            exit 1
          fi
          echo "✅ Found binary: $BIN_PATH"
          mkdir -p artifacts
          cp "$BIN_PATH" "artifacts/${{ matrix.artifact_name }}"
          echo "✅ Renamed to artifacts/${{ matrix.artifact_name }}"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
